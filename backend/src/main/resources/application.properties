spring.application.name=Hospital Management System

# JWT
jwt.secret=${JWT_SECRET:9hklsjSTS+3sH5UY5y6zsc81TEuJTsWxZfaQOC5dz2o=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Database (env-var driven so it works locally and on Render/Railway/Neon free tiers)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hms}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# JPA / Hibernate — schema is owned by Flyway, never auto-generated
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.aop.proxy-target-class=true
spring.jpa.properties.hibernate.jdbc.batch_size=${JPA_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection pool defaults sized for a small production deployment. Override per instance.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:30}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:1000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true

# CORS — comma-separated list; set FRONTEND_URL env var to your deployed Vercel URL
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:5174}

server.port=${PORT:8080}
server.tomcat.threads.max=${SERVER_MAX_THREADS:200}
server.tomcat.accept-count=${SERVER_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=${SERVER_CONNECTION_TIMEOUT:5s}
server.max-http-request-header-size=${SERVER_MAX_HEADER_SIZE:16KB}
server.compression.enabled=true
server.compression.min-response-size=${HTTP_COMPRESSION_MIN_SIZE:1KB}
server.compression.mime-types=application/json,application/javascript,text/html,text/xml,text/plain,text/css,image/svg+xml
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# SMTP — used for OTP verification emails during self-registration (Gmail App Password works free)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Health and metrics are intentionally limited to non-sensitive operational data.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# Razorpay
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Provider-independent SMS transport. Leave URL empty for development fallback.
sms.provider-url=${SMS_PROVIDER_URL:}
sms.api-key=${SMS_API_KEY:}
sms.sender-id=${SMS_SENDER_ID:HealthBoxD}
sms.dev-inspector-enabled=${SMS_DEV_INSPECTOR_ENABLED:false}
notifications.worker-delay-ms=${NOTIFICATIONS_WORKER_DELAY_MS:5000}

# Platform fee kept out of every transaction, in paise (75 = ₹0.75)
platform.fee-paise=${PLATFORM_FEE_PAISE:75}

# Super admin (platform owner) — provisioned on boot if these are set and no SUPER_ADMIN exists yet
superadmin.username=${SUPERADMIN_USERNAME:}
superadmin.password=${SUPERADMIN_PASSWORD:}
superadmin.email=${SUPERADMIN_EMAIL:}
superadmin.phno=${SUPERADMIN_PHNO:}
